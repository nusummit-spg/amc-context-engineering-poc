# Opt-in, manual only. Never releases or runs expensive CI on every push.
name: AMC Wave 2.9 Integration Qualification
on:
  workflow_dispatch:
    inputs:
      full_backend:
        description: 'Also run full app pytest (expensive, may need external services)'
        type: boolean
        required: true
        default: false
jobs:
  offline-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checked-out commit
        shell: python
        run: |
          import os, subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha == os.environ['GITHUB_SHA'], (sha, os.environ['GITHUB_SHA'])
      - name: Install deterministic dependencies
        run: python -m pip install 'SQLAlchemy>=2,<3' 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2' 'alembic>=1.13,<2' 'fastapi>=0.115'
      - name: Wave 2.9 ingress, source, authority fencing tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q tools/amc_release/tests_wave29 --junitxml=wave29-${{ matrix.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave29-${{ matrix.os }}
          path: wave29-${{ matrix.os }}.xml
          if-no-files-found: error
  full-app:
    if: inputs.full_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Collect and run complete backend suite (fail on errors)
        working-directory: backend
        run: |
          python -m pytest tests/ --collect-only -q
          python -m pytest tests/ -q --junitxml=../wave29-full-backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave29-full-backend
          path: wave29-full-backend.xml
          if-no-files-found: error
