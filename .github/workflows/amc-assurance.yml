# AMC Assurance Workflow
# Implements A01-A07: Clean checkout audit, migration rehearsal, CI workflow,
# deterministic regression, fault-injection/SLO, canary/rollback runbook, release decision

name: AMC Assurance Pipeline

on:
  push:
    branches: [main, develop, feature/*, amc-dev]
  pull_request:
    branches: [main, amc-dev]
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: full, quick, or qa"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - quick
          - qa

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "${{ vars.DATABASE_URL }}"
  NEO4J_URI: "${{ vars.NEO4J_URI }}"
  NEO4J_USER: "${{ vars.NEO4J_USER }}"
  NEO4J_PASSWORD: "${{ secrets.NEO4J_PASSWORD }}"

jobs:
  # A01: Clean checkout audit
  audit-checkout:
    name: "A01: Clean Checkout Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --dry-run
          echo "Dependencies validated"

      - name: Compile
        run: python -m compileall -q backend

      - name: Import check
        run: |
          cd backend
          python -c "import app" || exit 1
          echo "All imports validated"

      # - name: Scan for secrets
      #   uses: gitleaks/gitleaks-action@v3
      #   env:
      #     GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      #   with:
      #     config-path: ".gitleaks.toml"
      #     exit-code: 1
      #     verbose: true
      #     redact: true
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml -v --no-git
          rm -f gitleaks

      - name: Audit requirements
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

   # A02: Migration rehearsal
  migrate-rehearse:
    name: "A02: Migration Rehearsal"
    runs-on: ubuntu-latest
    needs: audit-checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run migration rehearsal
        env:
          AMC_MIGRATION_DATABASE_URL: "sqlite:///./test_migrate.db"
        run: |
          cd backend
          pip install alembic sqlalchemy
          # Preflight: validate the revision DAG has no missing ancestors
          python scripts/alembic_dag_preflight.py
          alembic upgrade head
          alembic current
          alembic history | head -15
          # Downgrade and re-upgrade to test reversibility
          alembic downgrade base
          alembic upgrade head
          echo "Migration rehearsal passed"
          # Cleanup
          rm -f test_migrate.db

  # A03: CI workflow - unit tests
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: audit-checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          # Collect first to surface all import errors
          python -m pytest tests/ --collect-only -q 2>&1 | tail -20 || true
          # Run Wave 1.9/2.0 contract suites (deterministic, no external deps)
          python -m pytest tests/test_wave19_durable_publication.py \
            tests/test_wave19_contracts.py \
            tests/test_wave19_integrity_feedback_migration.py \
            tests/test_wave20_audit.py \
            tests/test_wave20_independent.py \
            tests/test_wave20_ingestion.py \
            tests/test_wave20_wave19_contract.py \
            tests/regression/ \
            tests/fault_injection/ \
            -v --tb=short
          echo "Unit tests completed"

  # A04: Deterministic regression
  deterministic-regression:
    name: "A04: Deterministic Regression"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run regression tests
        run: |
          cd backend
          pip install -r requirements.txt pytest
          if [ ! -d "tests/regression" ]; then
            echo "ERROR: tests/regression directory not found"
            exit 1
          fi
          python -m pytest tests/regression/ -v --tb=short
          echo "Deterministic regression completed"

  # A05: Fault injection / SLO
  fault-injection:
    name: "A05: Fault Injection / SLO"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run fault injection tests
         run: |
          cd backend
          pip install -r requirements.txt pytest
          if [ ! -d "tests/fault_injection" ]; then
            echo "ERROR: tests/fault_injection directory not found"
            exit 1
          fi
          python -m pytest tests/fault_injection/ -v --tb=short
          echo "Fault injection tests completed"

      - name: Check SLO metrics
        run: |
          echo "Checking SLO metrics (placeholder - requires actual metrics collection)"
          # SLO verification requires real observability infrastructure
          # This job should fail if metrics are not properly instrumented

  # A06: Canary / Rollback runbook
  canary-deployment:
    name: "A06: Canary Deployment"
    runs-on: ubuntu-latest
    needs: fault-injection
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amc-dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canary status
        run: |
          echo "GATE_STATUS=NON_RELEASE"
          echo "Canary deployment requires a real staging environment."
          echo "This job is intentionally NOT_RUN until a deployment target is configured."
          echo "Release remains BLOCKED until actual canary evidence is produced."

  # A07: Release decision
  release-gate:
    name: "A07: Release Gate"
    runs-on: ubuntu-latest
    needs: [canary-deployment, deterministic-regression]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amc-dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release gate
        run: |
          echo "=== AMC Release Gate ==="
          echo "GATE_STATUS: NON_RELEASE"
          echo "SHA: ${{ github.sha }}"
          echo "Run: ${{ github.run_id }}"
          echo ""
          echo "Required before release (all currently INCOMPLETE):"
          echo "  [ ] Real canary deployment with probe evidence"
          echo "  [ ] SLO measurements (not placeholder)"
          echo "  [ ] Security/privacy signoff"
          echo "  [ ] Maintainer go/no-go decision signed"
          echo ""
          echo "This CI run provides test evidence only."
          echo "Do NOT merge to main or tag a release from this workflow alone."
          echo "{\"gate\":\"NON_RELEASE\",\"sha\":\"${{ github.sha }}\",\"run\":\"${{ github.run_id }}\"}" > RELEASE_GATE.json
      - name: Upload gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: RELEASE_GATE.json
          retention-days: 30