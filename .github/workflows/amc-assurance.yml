# AMC Assurance Workflow
# Implements A01-A07: Clean checkout audit, migration rehearsal, CI workflow,
# deterministic regression, fault-injection/SLO, canary/rollback runbook, release decision

name: AMC Assurance Pipeline

on:
  push:
    branches: [main, develop, feature/*, amc-dev]
  pull_request:
    branches: [main, amc-dev]
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: full, quick, or qa"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - quick
          - qa

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "${{ vars.DATABASE_URL }}"
  NEO4J_URI: "${{ vars.NEO4J_URI }}"
  NEO4J_USER: "${{ vars.NEO4J_USER }}"
  NEO4J_PASSWORD: "${{ secrets.NEO4J_PASSWORD }}"

jobs:
  # A01: Clean checkout audit
  audit-checkout:
    name: "A01: Clean Checkout Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --dry-run
          echo "Dependencies validated"

      - name: Verify imports
        run: |
          cd backend
          python -m compileall -q . || exit 1
          python -c "import app" || exit 1
          echo "All imports validated"

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: ".gitleaks.toml"
          verbose: true

      - name: Audit requirements
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit || exit 1

  # A02: Migration rehearsal
  migrate-rehearse:
    name: "A02: Migration Rehearsal"
    runs-on: ubuntu-latest
    needs: audit-checkout
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_amc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run migration rehearsal
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_amc"
        run: |
          cd backend
          pip install -r requirements.txt
          # Upgrade from scratch
          alembic upgrade head
          # Verify schema
          alembic current
          # Downgrade to initial
          alembic downgrade base
          # Upgrade again
          alembic upgrade head
          echo "Migration rehearsal passed"

  # A03: CI workflow - unit tests
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: audit-checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd backend
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short -x
          else
            echo "No tests directory; skipping"
            exit 0
          fi
          echo "Unit tests completed"

  # A04: Deterministic regression
  deterministic-regression:
    name: "A04: Deterministic Regression"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run regression tests
        run: |
          cd backend
          if [ -d "tests/regression" ]; then
            pytest tests/regression/ -v || exit 1
          else
            echo "ERROR: No regression tests directory; test discovery failed"
            exit 1
          fi
          echo "Deterministic regression completed"

  # A05: Fault injection / SLO
  fault-injection:
    name: "A05: Fault Injection / SLO"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run fault injection tests
        run: |
          cd backend
          if [ -d "tests/fault_injection" ]; then
            pytest tests/fault_injection/ -v --tb=short || exit 1
          else
            echo "ERROR: No fault_injection tests directory; test discovery failed"
            exit 1
          fi
          echo "Fault injection tests completed"

      - name: Check SLO metrics
        run: |
          echo "Checking SLO metrics (placeholder - requires actual metrics collection)"
          # SLO verification requires real observability infrastructure
          # This job should fail if metrics are not properly instrumented

  # A06: Canary / Rollback runbook
  canary-deployment:
    name: "A06: Canary Deployment"
    runs-on: ubuntu-latest
    needs: fault-injection
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amc-dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy canary
        run: |
          echo "Canary deployment requires real infrastructure"
          echo "Skipping actual deployment - use for deployment testing only"

  # A07: Release decision
  release-gate:
    name: "A07: Release Gate"
    runs-on: ubuntu-latest
    needs: [canary-deployment, deterministic-regression]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/amc-dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release decision
        run: |
          echo "=== Release Gate Matrix ==="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Build ID: ${{ github.run_id }}"
          echo "Note: Release requires manual verification and signed decision"
          echo "This CI run provides evidence only, not automatic approval"
          echo "=== CI Evidence ==="
          echo "Migrations: CHECKED"
          echo "Tests: CHECKED"
          echo "Fault Injection: CHECKED"
          echo "SLO Metrics: PENDING (requires instrumentation)"
          echo "Canary: PENDING (requires infrastructure)"
          echo "=========================="
          echo "CI verification complete. Manual release decision required."
          echo "${{ github.sha }}" > RELEASE_SHA.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: RELEASE_SHA.txt
          retention-days: 30