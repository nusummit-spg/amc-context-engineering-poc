server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Single-page app: any unknown path falls back to index.html so client-side
  # navigation (and hard refreshes on a deep link) both work.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Optional: uncomment to reverse-proxy /api to a backend container on the
  # same Docker network instead of baking VITE_API_BASE_URL as an absolute
  # URL at build time. If you use this, build the image with
  # --build-arg VITE_API_BASE_URL=/api
  #
  # location /api/ {
  #   proxy_pass http://api:8000/api/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  # }
}
