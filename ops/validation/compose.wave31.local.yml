# Disposable AMC Wave 3.1 LOCAL qualification providers only.
# Never attach production credentials, datasets or shared volumes.
# Start: docker compose -p amc31-qa -f ops/validation/compose.wave31.local.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amc_qa
      POSTGRES_DB: amc_qa
      POSTGRES_PASSWORD: ${AMC_TEST_PG_PASSWORD:?Set AMC_TEST_PG_PASSWORD to a LOCAL test secret}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amc_qa -d amc_qa"]
      interval: 5s
      timeout: 5s
      retries: 20
  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/${AMC_TEST_NEO4J_PASSWORD:?Set AMC_TEST_NEO4J_PASSWORD to a LOCAL test secret}
      AMC_TEST_NEO4J_PASSWORD: ${AMC_TEST_NEO4J_PASSWORD:?Set AMC_TEST_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:57474:7474"
      - "127.0.0.1:57687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$$AMC_TEST_NEO4J_PASSWORD" "RETURN 1" >/dev/null 2>&1 || exit 1'
      interval: 10s
      timeout: 8s
      retries: 20
volumes:
  pg_data:
  neo4j_data:
